<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MetaFight · 平台测试场</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="viewportFrame">
  <main id="app">
    <canvas id="screen" aria-label="三维测试场"></canvas>
    <section id="play" class="hidden" aria-label="测试操作区">
      <header class="hud"><span>METAFIGHT <small>平台测试场</small></span><span id="ammo">等待开始</span><button id="pause">暂停</button></header>
      <div id="reticle" aria-hidden="true">＋</div>
      <div id="moveZone" class="move-zone"><span>移动</span><i id="stick"></i></div>
      <div class="look-hint">右侧滑动转向</div>
      <button id="fire" class="fire">开火<span>按住并拖动可转向</span></button>
      <div id="liveStatus" class="live-status" aria-live="polite"></div>
    </section>
    <section id="panel" class="panel">
      <div class="identity"><span>METAFIGHT</span><small>M0.5 / 平台能力验证</small></div>
      <div class="panel-body">
        <div class="intro"><p class="eyebrow">货轮交锋 · 开发测试</p><h1 id="heading">先在这里<br>试试身手。</h1><p id="message">左侧移动，右侧转向，按住开火。当前仅测试运行能力，还不是完整对局。</p><p id="rotate" class="notice hidden">请横放手机。若画面仍不旋转，点“开启横向显示”。</p><p id="displayHint" class="notice hidden">手机顶部朝左横放；不玩时请点暂停。</p><button id="displayMode" class="secondary hidden">开启横向显示</button><button id="start" class="primary" disabled>正在读取设置…</button><button id="reset" class="secondary hidden">重置测试场</button></div>
        <div class="controls"><h2>本次测试</h2><label for="sensitivity">转向灵敏度 <output id="sensitivityValue">1.0</output></label><input id="sensitivity" type="range" min="0.25" max="3" step="0.25" value="1" disabled><button id="save" disabled>保存灵敏度</button><p id="storageStatus" class="status" aria-live="polite">正在连接本地设置</p><button id="sound" disabled>试听声音</button><p id="audioStatus" class="status">默认静音；点击试听后启用枪声</p><div class="links"><button id="diagnostics">查看测试记录</button><button id="license">开源许可</button></div></div>
      </div>
      <footer><span id="channel">正在识别运行环境</span><span id="build"></span></footer>
    </section>
    <section id="details" class="details hidden" aria-label="测试记录与许可">
      <div class="details-heading"><h2 id="detailsTitle">测试记录</h2><button id="closeDetails">返回</button></div>
      <pre id="detailsText"></pre><div class="pages"><button id="previous">上一页</button><span id="pageNumber"></span><button id="next">下一页</button></div>
    </section>
  </main>
  </div>
  <button id="recoverDisplay" class="hidden" aria-label="恢复竖向菜单">恢复显示</button>
  <script src="./app.js"></script>
</body>
</html>
