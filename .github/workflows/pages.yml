name: Publish Pages
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Validated source commit or tag (also used for recovery)
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/release/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated candidate
        id: deployment
        uses: actions/deploy-pages@v4
